version: 1

spawn: cottage

characters:
  wizard:
    name: "Aldric"
    color: "#9b59b6"
  
  player:
    name: "Traveler"
    color: "#3498db"

rooms:
  cottage:
    shortDescription: "A cozy stone cottage"
    longDescription: "A small cottage with a thatched roof and warm fireplace. An old wizard sits by the fire."
    actions:
      "Talk to wizard": 
        dialogue: wizardMeeting
      "Exit to garden": 
        print: "You step outside into the garden."
        go: garden

  garden:
    shortDescription: "An overgrown garden"
    longDescription: "Wild roses climb the ancient stone walls. A mysterious archway stands among the tangled vines."
    actions:
      "Return to cottage":
        print: "You return to the cottage."
        go: cottage
      "Examine archway": "examineArchway"

events:
  examineArchway:
    check:
      test: hasItem
      arguments: ["spellbook"]
      failed:
        print: "The archway seems dormant. Perhaps it requires magic to activate."
    print: "The archway begins to glow with magical energy!"

dialogues:
  wizardMeeting:
    start: greeting
    nodes:
      greeting:
        message:
          speaker: wizard
          text: "[i]Well, well...[/i] A visitor! What brings you to my humble cottage?"
          choices:
            - ["Who are you?", introduction]
            - ["I need help", helpRequest]
            - ["Just passing through", farewell]

      introduction:
        message:
          speaker: wizard
          text: "I am Aldric the Ancient, keeper of arcane knowledge and guardian of this enchanted garden."
          choices:
            - ["Tell me about the garden", gardenPath]
            - ["Can you teach me magic?", magicHelp]
            - ["I should go", farewell]

      helpRequest:
        branch:
          condition: hasItem
          true: alreadyHasBook
          false: offerHelp

      offerHelp:
        message:
          speaker: wizard
          text: "Hmm, you seem genuine. Perhaps I can assist you. What do you seek?"
          choices:
            - ["Magic training", magicHelp]
            - ["Knowledge of the garden", gardenPath]
            - ["Nothing, thank you", farewell]

      alreadyHasBook:
        message:
          speaker: wizard
          text: "I see you already possess my spellbook. Use it wisely, young one."
          choices:
            - ["Tell me more about it", bookExplanation]
            - ["Goodbye", farewell]

      bookExplanation:
        message:
          speaker: wizard
          text: "The spellbook contains ancient incantations. The garden archway will respond to your magical touch now."
          next: farewell

      magicHelp:
        sequence:
          - message:
              speaker: wizard
              text: "Magic requires dedication and the right tools. I sense potential in you."

          - message:
              speaker: wizard
              text: "Take this ancient spellbook. It contains the basics you'll need."
              choices:
                - text: "Thank you!"
                  next: receiveBook
                  events:
                    callFunctions:
                      addItem: ["spellbook"]
                      setFlag: ["receivedBook", "true"]

                - ["I'm not ready", notReady]

      receiveBook:
        message:
          speaker: wizard
          text: "Use it well. The garden archway may now respond to your presence."
          choices:
            - ["I'll practice carefully", farewell]

      notReady:
        message:
          speaker: wizard
          text: "Very well. Return when you feel prepared."
          next: farewell

      gardenPath:
        message:
          speaker: wizard
          text: "Ah, the garden holds many secrets. The archway is particularly interesting..."
          choices:
            - text: "What does it do?"
              next: archwayCond
              condition: hasFlag
              else: archwayBasic

            - ["Maybe another time", greeting]

      archwayBasic:
        message:
          speaker: wizard
          text: "I cannot reveal its secrets to just anyone. Perhaps if you were a student of magic..."
          choices:
            - ["Can you teach me?", magicHelp]
            - ["I understand", farewell]

      archwayCond:
        message:
          speaker: wizard
          text: "Since you possess the spellbook, I can tell you - it's a portal to the ancient library. Touch it with your magical focus."
          choices:
            - ["Fascinating!", farewell]

      farewell:
        message:
          speaker: player
          text: "Goodbye, Aldric. Thank you for your time."
          next: exit

      exit: null