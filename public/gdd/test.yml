spawn: main-room

Entities:
  joe-id:
    name: "Joe Bob"
    interaction: 1


Interactions:
  1:
    # HTML supported. Implicit <p>. New lines and line breaks should pause the dialogue and
    # wait for user input. The dialogue stops when the current node has no
    # options available. Dialogue nodes with no text do not require user to go
    # to the options, or in case of a lack of options, to end.
    response: >
      This is the end...
      <br>
      <b>I will burn the closet!</b>
    events:
      - burn-closet
    reactions:
      "I shall kill you for this!": 2
      "Ok":
        text: "Wait, you're really just gonna let me?"
        options:
          "Yeah":
            text: "alright, then"
  2:
    text: "I have been killed..."
    options:

rooms:
  main-room:
    short-description: It is the room outside of the closet.
    long-description: I don't have time to look around this room.

  closet:
    short-description: It is a closet, smells bad.
    long-description: >
      The closet stretches from floor to ceiling, its double doors painted a
      crisp eggshell white that contrasts with the brushed nickel handles. When
      opened, they reveal a space roughly six feet wide and four feet deep,
      meticulously organized yet bearing the subtle signs of daily use.

      The top shelf, just barely reachable without a step stool, holds clear
      plastic bins containing out-of-season items and rarely-used formal wear,
      their contents visible through slightly dusty sides.
    actions:
      go-to-main-room:
        go: main-room
      burn-closet:
        events:
          - burn-closet

# Events
events:
  burn-closet-2:
    print: hello

  burn-closet:
    print: The closet has been burned!
    chain:
      - burn-closet-2
    update-rooms:
      - closet:
          short-description: It is a closet, it is burned.
          long-description: >
            The closet stands as a blackened wound in the bedroom wall, its
            once-white doors now warped and peeling, hanging askew from melted
            hinges. The intense heat has transformed the painted surface into a
            landscape of bubbled and cracked terrain, with edges curled like
            burnt paper.

            Through the gap where the doors no longer meet, glimpses of the
            devastation within reveal a cavity of absolute darkness, the walls
            coated in a thick layer of soot that transforms every surface into
            the same uniform shade of charcoal.
